[project]
name = "proyecto"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.13.*"
dependencies = [
    "androguard>=4.1.3",
    "django>=6.0.5",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
