[project]
name = "proyecto"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "androguard>=4.1.3",
    "django>=5.2",
    "gunicorn",
    "whitenoise",
    "numpy>=2.2",
    "pillow>=11",
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apk_detector.settings"
pythonpath = ["app"]
testpaths  = ["app/pipeline/tests"]
